<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>通勤スマートタイマー</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#64b5f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary-blue: #0b4ca8;       /* 濃紺のテキスト・ボーダー */
      --card-bg: #ffffff;
      --card-shadow: #2290f0;        /* カード下の立体水色シャドウ */
      --badge-green: #6ee7b7;        /* 快特バッジ (ミントグリーン) */
      --badge-pink: #f87171;         /* 特急バッジ (コーラルピンク) */
      --badge-gray: #94a3b8;         /* 直通バッジ (グレー) */
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #64b5f6 0%, #a4e1ff 40%, #68baf7 100%);
      color: var(--primary-blue);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1.25rem 2rem 1.25rem;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* 最上部ステータス（天気・ダイヤ種別） */
    .top-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.5rem;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-blue);
      opacity: 0.85;
    }

    /* 便カード一覧コンテナ */
    #trainList {
      display: flex;
      flex-direction: column;
      gap: clamp(1.8rem, 4vh, 3rem); /* 便と便の間隔を画面に応じて柔軟に拡大 */
    }

    /* 1便あたりのブロック */
    .train-block {
      display: flex;
      flex-direction: column;
      gap: 1.1rem; /* カードと下のタイマーの間隔を広めに確保 */
    }

    /* メインのカード */
    .train-card {
      background: var(--card-bg);
      border: 3.5px solid var(--primary-blue);
      border-radius: 46px;
      padding: 1.35rem 1.6rem 1.5rem 1.6rem;
      box-shadow: 0 10px 0 var(--card-shadow);
      position: relative;
    }

    /* 日付表示 */
    .card-date {
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .card-date .day-badge {
      font-size: clamp(1.15rem, 3.8vw, 1.35rem);
      font-weight: 800;
    }
    .card-date .weekday-text {
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* 駅名と仕切り線 */
    .station-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .station-name {
      font-size: clamp(1.35rem, 5.5vw, 1.7rem);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .station-divider {
      flex: 1;
      height: 1.5px;
      background: #94a3b8;
      margin: 0 clamp(8px, 3vw, 16px);
      opacity: 0.6;
    }

    /* 時刻と乗継バッジ */
    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: clamp(1.05rem, 3.8vw, 1.25rem);
    }
    .arr-group {
      display: flex;
      align-items: center;
      gap: clamp(6px, 2vw, 10px);
    }

    /* 乗り換えバッジ（画面幅に連動） */
    .transfer-pill {
      font-size: clamp(0.68rem, 2.3vw, 0.82rem);
      font-weight: 700;
      padding: clamp(2px, 0.8vw, 4px) clamp(7px, 2.4vw, 12px);
      border-radius: 999px;
      color: #ffffff;
      white-space: nowrap;
    }
    .pill-green { background: var(--badge-green); }
    .pill-pink { background: var(--badge-pink); }
    .pill-gray { background: var(--badge-gray); }

    /* カード下のサブ情報 */
    .card-footer {
      display: flex;
      align-items: flex-start;
      gap: clamp(1.5rem, 6vw, 2.5rem);
      padding-left: 0.5rem;
    }
    .footer-group {
      display: flex;
      flex-direction: column;
    }
    .footer-label {
      font-size: clamp(0.7rem, 2.2vw, 0.8rem);
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 2px;
    }
    .footer-val {
      font-size: clamp(1.2rem, 4.2vw, 1.45rem);
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .footer-val .min-text {
      font-size: clamp(1.2rem, 4.2vw, 1.45rem);
      font-weight: 900;
    }
    .footer-val .sec-text {
      font-size: clamp(0.85rem, 2.8vw, 1rem);
      font-weight: 700;
      opacity: 0.8;
      margin-left: 4px;
    }

    .no-trains {
      text-align: center;
      padding: 3rem 1rem;
      font-weight: 700;
      color: var(--primary-blue);
      background: rgba(255, 255, 255, 0.5);
      border-radius: 24px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 最上部ステータス -->
  <div class="top-meta-bar">
    <span id="scheduleType">判定中...</span>
    <span id="weatherStatus">天気取得中...</span>
  </div>

  <!-- 画面の縦幅に応じて動的に便カードが生成されるエリア -->
  <div id="trainList"></div>
</div>

<!-- 先ほどスクレイピングした全便ダイヤファイル -->
<script src="timetables.js"></script>

<script>
  const SETTINGS = {
    walkTimeSunny: 8,   // 晴れ/曇りの徒歩分数
    walkTimeRain: 11,   // 雨の徒歩分数 (+3分)
    stationBuffer: 0,   // 改札・ホーム余裕時間
    lat: 35.2587,       // 馬堀海岸駅の緯度
    lon: 139.7045       // 馬堀海岸駅の経度
  };

  const DAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];
  let isRain = false;
  let isHoliday = false;

  const toSec = (h, m, s = 0) => h * 3600 + m * 60 + s;
  const pad = (n) => String(n).padStart(2, '0');

  // 1. 待ち時間ゼロの即時初期化
  const today = new Date();
  isHoliday = (today.getDay() === 0 || today.getDay() === 6);
  updateStatusHeaders();
  render();
  setInterval(render, 1000);

  function updateStatusHeaders() {
    document.getElementById("scheduleType").textContent = isHoliday ? "土休日ダイヤ" : "平日ダイヤ";
    const walkMin = isRain ? SETTINGS.walkTimeRain : SETTINGS.walkTimeSunny;
    document.getElementById("weatherStatus").textContent = isRain ? `🌧️ 雨 (徒歩${walkMin}分)` : `☀️ 晴/曇 (徒歩${walkMin}分)`;
  }

  // 2. 非同期で祝日＆天気をバックグラウンド更新
  async function fetchConditionsFast() {
    const dateStr = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
    const [holRes, wRes] = await Promise.allSettled([
      fetch("https://holidays-jp.github.io/api/v1/date.json").then(r => r.json()),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SETTINGS.lat}&longitude=${SETTINGS.lon}&current=precipitation,weather_code&timezone=Asia%2FTokyo`).then(r => r.json())
    ]);

    if (holRes.status === "fulfilled" && holRes.value[dateStr]) {
      isHoliday = true;
    }
    if (wRes.status === "fulfilled") {
      const current = wRes.value.current;
      isRain = (current?.precipitation > 0 || (current?.weather_code ?? 0) >= 51);
    }
    updateStatusHeaders();
    render();
  }
  fetchConditionsFast();

  // 3. レンダリングループ（画面縦幅に応じた便数の自動充填）
  function render() {
    const listContainer = document.getElementById("trainList");
    if (typeof TIMETABLES === 'undefined') {
      listContainer.innerHTML = '<div class="no-trains">timetables.js を読み込み中...</div>';
      return;
    }

    const now = new Date();
    const currentSec = toSec(now.getHours(), now.getMinutes(), now.getSeconds());

    const walkMin = isRain ? SETTINGS.walkTimeRain : SETTINGS.walkTimeSunny;
    const totalLeadSec = (walkMin + SETTINGS.stationBuffer) * 60;

    const activeList = isHoliday ? TIMETABLES.holiday : TIMETABLES.weekday;

    const processed = activeList.map(t => {
      const depSec = toSec(t.dh, t.dm);
      const leaveSec = depSec - totalLeadSec;
      return { ...t, depSec, leaveSec };
    });

    // 玄関を出るリミットに間に合う便を抽出
    const available = processed.filter(t => t.leaveSec > currentSec);

    if (available.length === 0) {
      listContainer.innerHTML = '<div class="no-trains">本日の間に合う便はありません（運行終了）</div>';
      return;
    }

    // --- 画面縦幅に応じた便数の自動計算 ---
    const screenH = window.innerHeight;
    const headerOffset = 90; // 上部バーや画面上下パディング
    const cardHeight = 230;  // 1便あたりの専有高（カード＋タイマー＋余白）
    
    // 画面の高さに応じて 1便〜最大4便 の間で自動充填
    const displayCount = Math.max(1, Math.min(4, Math.floor((screenH - headerOffset) / cardHeight)));
    const trainsToShow = available.slice(0, displayCount);

    const yyyy = now.getFullYear();
    const mm = pad(now.getMonth() + 1);
    const dd = pad(now.getDate());
    const dayStr = DAYS_JP[now.getDay()];

    listContainer.innerHTML = trainsToShow.map(train => {
      // 接続種別に応じたバッジカラー判定
      let pillClass = "pill-gray";
      let pillText = "直通";
      if (train.transfer) {
        const isKaitoku = train.transfer.type === "快特";
        pillClass = isKaitoku ? "pill-green" : "pill-pink";
        pillText = "堀ノ内で乗継";
      }

      // カウントダウン
      const diffSec = train.leaveSec - currentSec;
      const min = Math.floor(diffSec / 60);
      const sec = diffSec % 60;

      return `
        <div class="train-block">
          <div class="train-card">
            <div class="card-date">
              <span>${yyyy}.${mm}.${dd}</span>
              <span class="day-badge">${dayStr}</span>
              <span class="weekday-text">曜日</span>
            </div>

            <div class="station-row">
              <span class="station-name">馬堀海岸</span>
              <div class="station-divider"></div>
              <span class="station-name">横須賀中央</span>
            </div>

            <div class="time-row">
              <span>${pad(train.dh)}:${pad(train.dm)}</span>
              <div class="arr-group">
                <span class="transfer-pill ${pillClass}">${pillText}</span>
                <span>${pad(train.ah)}:${pad(train.am)}</span>
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div class="footer-group">
              <span class="footer-label">方面</span>
              <span class="footer-val">上り</span>
            </div>
            <div class="footer-group">
              <span class="footer-label">自宅出発締切まで</span>
              <div class="footer-val">
                あと <span class="min-text">${min}分</span><span class="sec-text">${pad(sec)}秒</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  // 画面の回転やリサイズ時にも即時再計算
  window.addEventListener("resize", render);

  // 4. Service Worker登録
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
  }
</script>

</body>
</html>
